name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main, 'claude/**' ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate word list
        run: |
          pip install wordfreq
          python scripts/make_wordlist.py app/src/main/assets/wordlist.txt 100000
          head -5 app/src/main/assets/wordlist.txt
          ls -l app/src/main/assets

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CustomKeyboard-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
